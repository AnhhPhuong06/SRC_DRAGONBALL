name: Ubuntu Java 21 build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ephemeral-root-password
          MARIADB_DATABASE: jdbc_test
          MARIADB_USER: jdbc_ci
          MARIADB_PASSWORD: ephemeral-jdbc-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check shell syntax and isolated setup tests
        run: |
          for file in *.sh; do bash -n "$file"; done
          python3 test/termux_manager_test.py
          python3 test/portable_deploy_test.py
          python3 -m py_compile tools/*.py
      - name: Compile and package without starting the game or database
        run: python3 tools/server_cli.py build
      - name: Load configured JDBC driver through packaged classpath
        run: |
          mkdir -p build/driver-check
          javac -proc:none -d build/driver-check test/JdbcDriverLoadTest.java
          java -cp "dist/chienbinhlucy.jar:build/driver-check" JdbcDriverLoadTest
      - name: Verify starter punch and skill cooldown packets
        run: |
          mkdir -p build/cooldown-check
          javac -proc:none -cp dist/chienbinhlucy.jar -d build/cooldown-check test/NewPlayerSkillCooldownTest.java
          java -cp "dist/chienbinhlucy.jar:build/cooldown-check" NewPlayerSkillCooldownTest
      - name: Connect production database layer to real MariaDB 10.11
        env:
          NRO_JDBC_INTEGRATION: 'true'
          JDBC_CI_PASSWORD: ephemeral-jdbc-password
        run: |
          javac -proc:none -cp dist/chienbinhlucy.jar -d build/driver-check test/JdbcMariaDbIntegrationTest.java
          mkdir -p build/jdbc-fixture
          cd build/jdbc-fixture
          java -cp "$GITHUB_WORKSPACE/dist/chienbinhlucy.jar:$GITHUB_WORKSPACE/build/driver-check" JdbcMariaDbIntegrationTest
