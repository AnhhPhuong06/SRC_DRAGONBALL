name: Ubuntu Java 21 build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check shell syntax and isolated setup tests
        run: |
          for file in *.sh; do bash -n "$file"; done
          python3 test/termux_manager_test.py
          python3 test/portable_deploy_test.py
          python3 -m py_compile tools/*.py
      - name: Compile and package without starting the game or database
        run: python3 tools/server_cli.py build
